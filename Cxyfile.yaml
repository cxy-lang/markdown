package:
  name: markdown
  version: 0.2.0
  author: Carter Mbotho<lastcarter@gmail.com>
  description: Markdown to HTML parser for Cxy with CommonMark support, file caching, and semantic mk-* CSS class output
  license: MIT

builds:
  example-markdown:
    entry: examples/markdown.cxy
    output: markdown
    flags:
      - --memory-trace

dependencies: []

tests:
  - file: "src/**/*.cxy"

scripts:
  build-examples:
    inputs:
      - examples/markdown.cxy
      - "src/**/*.cxy"
    outputs:
      - "{{BUILD_DIR}}/markdown"
    command: cxy package build example-markdown
  run-examples:
    depends: [ build-examples ]
    command: |
      (
        cd {{BUILD_DIR}}
        ./markdown
      )

